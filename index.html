/* =========================================================

   - Local copy in IndexedDB: the app works fully offline.
   - Articles sync one row each; topics/colours/settings/chats as key-value rows.

const store = (() => {

  const run = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }));

    get: k => run('readonly', s => s.get(k)).catch(() => { try { return JSON.parse(localStorage.getItem(lsKey(k))); } catch (e) { return null; } }),
    set: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => { try { localStorage.setItem(lsKey(k), JSON.stringify(v)); } catch (e) { toast('Storage is full — export a backup in Settings.', 'error'); } }),
    del: k => run('readwrite', s => s.delete(k)).catch(() => { try { localStorage.removeItem(lsKey(k)); } catch (e) {} }),
  };
})();

const kvApply = (k, v) => { if (v == null) return; if (k === 'settings') Object.assign(S.settings, v); else S[k] = v; };

async function pullTable(table, keyCol, cursorKey, onRow) {
  for (;;) {
    const { data, error } = await supa.from(table).select(`${keyCol},data,deleted,updated_at`).gt('updated_at', SYNC.meta[cursorKey]).order('updated_at', { ascending: true }).limit(500);
    if (error) throw error;

    if (data.length < 500) return;
  }
}
async function pullAll(first) {

    const dirty = !first && local && SYNC.meta.a[row.id] !== hj(local);
    if (row.deleted) { if (local && !dirty) { S.articles.splice(i, 1); any = true; } if (!dirty) delete SYNC.meta.a[row.id]; return; }

    if (!dirty) { if (hr !== hj(local)) { S.articles[i] = row.data; any = true; } SYNC.meta.a[row.id] = hr; }
  });

    const k = row.key; if (!KV_KEYS.includes(k) || row.deleted) return;
    const dirty = !first && SYNC.meta.k[k] !== hj(kvValue(k));

/* ---------- Authors & references (Sheffield Harvard / Cite Them Right) ---------- */
function parseAuthors(str) {
  return String(str || '').split(/;|\s+&\s+|\s+and\s+/).map(s => s.trim()).filter(Boolean).map(s => {
    if (s.includes(',')) { const [f, ...g] = s.split(','); return { family: f.trim(), given: g.join(' ').trim() }; }
    const p = s.split(/\s+/); return { family: p.pop(), given: p.join(' ') };
  });
}
const authorsToStr = au => (au || []).map(a => a.given ? `${a.family}, ${a.given}` : a.family).join('; ');
const initials = g => String(g || '').split(/[\s.]+/).filter(Boolean).map(p => p.split('-').map(x => x[0].toUpperCase() + '.').join('-')).join('');
function shortAuthors(a) {
  const f = (a.authors || []).map(x => x.family);
  if (!f.length) return 'Anon.';
  if (f.length === 1) return f[0];
  if (f.length === 2) return `${f[0]} and ${f[1]}`;
  if (f.length === 3) return `${f[0]}, ${f[1]} and ${f[2]}`;
  return `${f[0]} et al.`;
}
const yearOf = a => a.year || 'no date';
function inText(a, page, narrative = false) {
  const p = page ? `, p. ${page}` : '';
  return narrative ? `${shortAuthors(a)} (${yearOf(a)}${p})` : `(${shortAuthors(a)}, ${yearOf(a)}${p})`;
}
function refAuthors(a) {
  const au = a.authors || []; const f = x => `${x.family}${x.given ? ', ' + initials(x.given) : ''}`;
  if (!au.length) return 'Anon.';
  if (au.length >= 4 && !S.settings.listAllAuthors) return `${f(au[0])} et al.`;
  if (au.length === 1) return f(au[0]);
  return au.slice(0, -1).map(f).join(', ') + ' and ' + f(au[au.length - 1]);
}
function pagesFmt(p) {
  p = String(p || '').trim(); if (!p) return '';
  return /[-–]/.test(p) ? 'pp. ' + p.replace(/\s*[-–]+\s*/, '–') : p;
}
function reference(a, html = false) {
  const it = s => html ? `<i>${esc(s)}</i>` : s; const e = s => html ? esc(s) : s;
  const parts = [`${e(refAuthors(a))} (${e(yearOf(a))}) '${e(a.title || 'Untitled')}'`];
  if (a.journal) parts.push(it(a.journal));
  const vi = a.volume ? a.volume + (a.issue ? `(${a.issue})` : '') : '';
  if (vi) parts.push(e(vi));
  if (a.pages) parts.push(e(pagesFmt(a.pages)));
  let r = parts.join(', ') + '.';
  if (a.doi) r += ` Available at: ${e('https://doi.org/' + a.doi)}.`;
  else if (a.url) r += ` Available at: ${e(a.url)} (Accessed: ${fmtDate(a.added)}).`;
  return r;
}
function refWarnings(a) {
  const w = [];
  if (!a.authors?.length) w.push('No authors');
  if (!a.year) w.push('No year — renders as "(no date)"');
  if (!a.journal) w.push('No journal title');
  if (!a.volume) w.push('No volume (fine for online-first articles)');
  if (!a.pages) w.push('No page range');
  if (!a.doi && !a.url) w.push('No DOI or URL');
  return w;
}
const proxied = a => {
  const target = a.doi ? 'https://doi.org/' + a.doi : a.url;

};

/* ---------- Heuristic summariser (offline) ---------- */
const CUES = {
  thesis: /\b(this (article|paper|study|chapter) (argues|contends|proposes|examines|shows)|we (argue|contend|propose)|i argue|argues that|contend that|we term)\b/i,
  questions: /(\?|\bresearch questions?\b|\bRQ\d\b|\bwe ask\b|\basks (whether|how)\b|\bcentral question\b)/i,
  methodology: /\b(interview|survey|ethnograph|netnograph|content analysis|discourse analysis|multimodal|dataset|data set|corpus|sample[ds]?|sampling|coded|codebook|we (conducted|collected|analysed|analyzed)|scraped|API|computational|mixed[- ]method|qualitative|quantitative|inter-?coder|Krippendorff|NVivo)\b/i,
  findings: /\b(find|found|findings|results?|shows? that|reveal|suggest that|demonstrate|indicate|we conclude)\b/i,
  gap: /\b(little is known|little (research|attention)|gap|overlook|under-?(researched|explored|studied|theorised)|few studies|lacks?|remains? (unclear|absent|limited|dominated)|neglect|largely (absent|focused))\b/i,
};
function heuristicSummary(a) {
  const sents = splitSentences([a.abstract, a.content].join('\n\n'));
  const used = new Set(); const out = {};
  for (const k of ['questions', 'gap', 'methodology', 'thesis', 'findings']) {
    const hits = sents.filter(s => CUES[k].test(s) && !used.has(s));
    const pick = hits.slice(0, k === 'findings' || k === 'methodology' ? 3 : 2);
    pick.forEach(s => used.add(s));
    out[k] = pick.join(' ');
  }
  if (!out.thesis) out.thesis = sents[0] || '';
  return out;
}
function heuristicMeta(txt) {
  const lines = txt.split(/\n/).map(l => l.trim()).filter(Boolean);
  const doi = ((txt.match(DOI_RE) || [])[0] || '').replace(/[.,;)]+$/, '');
  const year = (txt.match(/\b(19[5-9]\d|20[0-4]\d)\b/) || [])[1] || '';
  const title = lines[0] && lines[0].length < 300 ? lines[0] : '';
  let authors = [];
  if (lines[1] && lines[1].length < 220 && !/abstract|journal|doi|vol/i.test(lines[1]))
    authors = lines[1].replace(/\d|\*|†/g, '').split(/,|;|\band\b|&/).map(s => s.trim()).filter(s => /^[A-ZÀ-Ý][\p{L}.'-]+(\s+[\p{L}.'-]+)+$/u.test(s)).map(s => { const p = s.split(/\s+/); return { family: p.pop(), given: p.join(' ') }; });
  const m = txt.match(/abstract[:.\s]*\n?([\s\S]{60,3000}?)(\n\s*\n|\bkeywords\b|\bintroduction\b)/i);
  return { title, authors, year, doi, abstract: m ? m[1].replace(/\s+/g, ' ').trim() : '' };
}

/* ---------- Markdown (chat) ---------- */
function inlineMd(s) {
  return s.replace(/\[([^\]]+)\]\(#hl:([a-z0-9]+)\)/gi, '<button data-act="goHL" data-id="$2" class="text-accent-600 dark:text-accent-400 underline underline-offset-2">$1</button>')
    .replace(/\[([^\]]+)\]\(#p:([a-z0-9]+):(\d+)\)/gi, '<button data-act="goPara" data-aid="$2" data-i="$3" class="text-accent-600 dark:text-accent-400 underline underline-offset-2">$1</button>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code class="px-1 rounded bg-ink-100 dark:bg-ink-800">$1</code>');
}
function md(src) {
  const lines = esc(src).split('\n'); let out = '', list = null, para = [];
  const fp = () => { if (para.length) { out += `<p>${inlineMd(para.join(' '))}</p>`; para = []; } };
  const fl = () => { if (list) { out += `<${list.t}>${list.items.map(i => `<li>${inlineMd(i)}</li>`).join('')}</${list.t}>`; list = null; } };
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) { fp(); fl(); out += `<h4 class="font-semibold mt-3 mb-1">${inlineMd(m[2])}</h4>`; }
    else if ((m = ln.match(/^\s*[-•*]\s+(.*)/))) { fp(); if (!list || list.t !== 'ul') { fl(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { fp(); if (!list || list.t !== 'ol') { fl(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); }
    else if ((m = ln.match(/^&gt;\s?(.*)/))) { fp(); fl(); out += `<blockquote>${inlineMd(m[1])}</blockquote>`; }
    else if (!ln.trim()) { fp(); fl(); }
    else { fl(); para.push(ln); }
  }
  fp(); fl(); return out;
}

/* ---------- Clipboard ---------- */
async function copyText(text, html) {
  try {
    if (html && window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/plain': new Blob([text], { type: 'text/plain' }), 'text/html': new Blob([html], { type: 'text/html' }) })]);
    } else await navigator.clipboard.writeText(text);
  } catch (e) {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (_) {} t.remove();
  }
  toast('Copied to clipboard');
}

const elOf = n => n.nodeType === 1 ? n : n.parentElement;

  const pa = elOf(r.startContainer)?.closest('[data-para]'), pb = elOf(r.endContainer)?.closest('[data-para]');
  const rect = r.getBoundingClientRect();
  if (!pa || pa !== pb) return { multi: true, rect, text: sel.toString() };
  const full = pa.textContent; let s = offsetIn(pa, r.startContainer, r.startOffset), e = offsetIn(pa, r.endContainer, r.endOffset);
  while (s < e && /\s/.test(full[s])) s++; while (e > s && /\s/.test(full[e - 1])) e--;

  return { para: +pa.dataset.para, start: s, end: e, text: full.slice(s, e), rect };
}

function positionSelTool() {
  const t = $('#seltool'); if (t.classList.contains('hidden') || !UI.sel) return;
  const sel = window.getSelection(); const rect = sel && sel.rangeCount ? sel.getRangeAt(0).getBoundingClientRect() : UI.sel.rect;

    const lines = []; let cur = null;
    const push = () => { if (cur && cur.text.trim()) lines.push(cur); cur = null; };
    for (const it of pg.items) {

    const bundle = topicBundle(t);
    if (!hasKey()) {
      const arts = [...new Set(items.map(x => x.a))];
      const text = `## ${t.name} — ${L('scaffold', 'هيكل أولي')}\n${t.description ? '*' + t.description + '*\n' : ''}\n**${L('Sources in this theme', 'مصادر هذا المحور')}:** ${arts.map(a => inText(a, '', true)).join('; ')}\n\n${arts.map(a => { const hs = items.filter(x => x.a === a && x.h); return `- **${inText(a, '', true)}:** ${stripLead(a.summary?.thesis || a.abstract).slice(0, 220) || '—'}${hs.length ? ` — ${L('key quote', 'اقتباس محوري')}: “${hs[0].h.text}”` : ''}`; }).join('\n')}\n\n**${L('Questions for the synthesis', 'أسئلة للتوليف')}:** ${L('Where do these sources converge on the theme? Where do units of analysis, platforms or methods diverge? Which gap does the cluster leave open for your thesis?', 'أين تتقاطع هذه المصادر حول المحور؟ وأين تختلف وحدات التحليل أو المنصات أو المناهج؟ وما الفجوة التي تتركها المجموعة مفتوحة لأطروحتك؟')}\n\n*${L('Offline scaffold — add an API key for a drafted synthesis.', 'هيكل أولي دون اتصال — أضف مفتاح API للحصول على توليف مكتوب.')}*`;
      UI.lastDraft[t.id] = { text, offline: true }; render(); return;
    }
    UI.busy['topic'] = true; render();
    try {
      const text = await claude(supSystem(), [{ role: 'user', content: TOPIC_TASK(t, bundle) }], 1800);
      t.draft = { text, offline: false, at: new Date().toISOString() }; save();
    } catch (e) { toast('Draft failed: ' + e.message, 'error'); }
    UI.busy['topic'] = false; render();
  },
  /* settings */
  addColor: () => { const pal = ['#a855f7', '#f97316', '#14b8a6', '#ef4444', '#84cc16']; S.colors.push({ key: 'c' + uid(), name: 'New category', hex: pal[S.colors.length % pal.length] }); save(); openSettings(); },
  rmColor: t => { const c = S.colors[+t.dataset.i]; const n = S.articles.reduce((k, a) => k + a.highlights.filter(h => h.color === c.key).length, 0); if (n && !confirm(L(`${n} highlights use “${c.name}”. They will move to “${S.colors[0].key === c.key ? S.colors[1].name : S.colors[0].name}”. Continue?`, `${n} من التظليلات تستخدم «${c.name}» وستُنقل إلى «${S.colors[0].key === c.key ? S.colors[1].name : S.colors[0].name}». متابعة؟`))) return; S.colors.splice(+t.dataset.i, 1); S.articles.forEach(a => a.highlights.forEach(h => { if (h.color === c.key) h.color = S.colors[0].key; })); save(); openSettings(); },
  exportJSON: () => { const blob = new Blob([JSON.stringify({ ...S, settings: { ...S.settings, apiKey: '' } }, null, 2)], { type: 'application/json' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = `mohammed-research-backup-${new Date().toISOString().slice(0, 10)}.json`; l.click(); URL.revokeObjectURL(u); toast('Backup exported (API key excluded)'); },
  resetAll: () => { if (!confirm(L('Replace everything with the sample library? Export a backup first if needed.', 'استبدال كل شيء بالمكتبة النموذجية؟ صدّر نسخة احتياطية أولاً إن لزم.'))) return; const key = S.settings.apiKey; S = seed(); S.settings.apiKey = key; UI.articleId = null; UI.view = 'library'; save(); closeModal(); render(); },
};
function refreshAfterEdit() {
  if (UI.view === 'reader') { renderBody(); renderPanel(); } else render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act; if (!A[act]) return;
  if (t.tagName === 'A') return;
  e.preventDefault(); A[act](t, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.field) {
    const a = art(); const k = t.dataset.field;
    if (k === 'authors') a.authors = parseAuthors(t.value);
    else if (k === 'doi') a.doi = (t.value.match(DOI_RE) || [''])[0];
    else a[k] = t.value;
    save();
    if (['title', 'authors', 'year', 'journal', 'volume', 'issue', 'pages', 'doi', 'url', 'abstract', 'status'].includes(k)) { const st = scrollY; render(); scrollTo(0, st); }
  }
  if (t.dataset.sectype != null) { const a = art(); const st = structureFor(a); if (st && st.sections[+t.dataset.sectype]) { st.sections[+t.dataset.sectype].type = t.value; save(); renderBody(); } }
  if (t.dataset.filter) { UI.filters[t.dataset.filter] = t.value; render(); }
  if (t.dataset.actChange === 'synthArticle') { UI.synthArticle = t.value; render(); }
  if (t.dataset.setting) { S.settings[t.dataset.setting] = t.type === 'checkbox' ? t.checked : t.value.trim(); save(); if (t.dataset.setting === 'serverClaude') { openSettings(); render(); } else if (UI.view === 'reader') renderPanel(); }
  if (t.dataset.colorHex != null) { S.colors[+t.dataset.colorHex].hex = t.value; save(); if (UI.view === 'reader') renderBody(); }
  if (t.dataset.colorName != null) { S.colors[+t.dataset.colorName].name = t.value.trim() || 'Untitled'; save(); if (UI.view !== 'reader') render(); else renderPanel(); }
  if (t.id === 'pdf-input' && t.files[0]) { processPdf(t.files[0]); t.value = ''; }
  if (t.id === 'importfile' && t.files[0]) {
    const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.articles)) throw 0; if (SYNC_ON && SESSION && !confirm(L(`Replace your synced library (${S.articles.length} articles, on all devices) with this backup (${d.articles.length} articles)?`, `استبدال مكتبتك المتزامنة (${S.articles.length} مقالاً على كل الأجهزة) بهذه النسخة (${d.articles.length} مقالاً)؟`))) return; const key = S.settings.apiKey; S = d; S.settings = Object.assign({}, S.settings, { apiKey: key }); S.chats = S.chats || {}; save(); closeModal(); UI.view = 'library'; UI.articleId = null; render(); toast('Backup imported'); } catch (_) { toast('Not a valid backup file', 'error'); } }; r.readAsText(t.files[0]);
  }
});
const saveSoon = debounce(save, 400);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field === 'critical') { art().critical = t.value; saveSoon(); }
  if (t.dataset.qfield) {
    const a = art(); const q = (a.quotations || []).find(x => x.id === t.dataset.id); if (!q) return;
    q[t.dataset.qfield] = t.value.trim(); saveSoon();
    if (t.dataset.qfield === 'page') { const c = document.querySelector(`[data-qcite="${q.id}"]`); if (c) c.textContent = inText(a, q.page); t.classList.toggle('!border-amber-300', !q.page); }
  }
  if (t.dataset.sum) { const a = art(); a.summary[t.dataset.sum] = t.value; a.summary.source = 'manual'; saveSoon(); }
  if (t.dataset.topic) { const tp = topicOf(UI.synthTopic); tp[t.dataset.topic] = t.value; saveSoon(); }
  if (t.dataset.filter === 'q') { UI.filters.q = t.value; filterSoon(); }
  if (t.id === 'gsearch') searchSoon(t.value);
});
const filterSoon = debounce(() => { const el = document.activeElement; const pos = el?.selectionStart; render(); const n = document.querySelector('[data-filter="q"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }, 250);
const searchSoon = debounce(v => { UI.globalQ = v; if (v.trim().length >= 2) { UI.view = 'search'; render(); } else if (UI.view === 'search') render(); }, 250);
document.addEventListener('keydown', e => {
  const t = e.target; const typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (t.dataset?.tag && (e.key === 'Enter' || e.key === ',')) { e.preventDefault(); const v = t.value.trim().replace(/,$/, ''); if (!v) return; const a = art(); const f = t.dataset.tag; if (!a[f].includes(v)) a[f].push(v); save(); renderPanel(); setTimeout(() => document.querySelector(`[data-tag="${f}"]`)?.focus(), 0); return; }
  if (t.id === 'chatin' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); A.sendChat(); return; }
  if (t.id === 'gsearch' && e.key === 'Enter') { UI.globalQ = t.value; UI.view = 'search'; render(); return; }
  if (t.id === 'newtopic' && e.key === 'Enter') { A.addTopic(); return; }
  if (e.key === 'Escape') { if ($('#modal-root').innerHTML) closeModal(); else if (UI.panelOpen) A.togglePanel(); hideSelTool(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); $('#gsearch').focus(); return; }
  if (UI.view === 'reader' && UI.sel && !UI.sel.multi && (e.key === 'q' || e.key === 'Q')) { e.preventDefault(); A.selQuote(); return; }
  if (UI.view === 'reader' && UI.sel && !UI.sel.multi && /^[1-8]$/.test(e.key)) { const c = S.colors[+e.key - 1]; if (c) { e.preventDefault(); addHighlight(c.key); } }
});

/* ---------- Boot ---------- */
addEventListener('online', () => syncNow());
addEventListener('offline', () => { if (SESSION) setSync('offline'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); else if (S) store.set('state', S); });
addEventListener('pagehide', () => { if (S) store.set('state', S); });
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 60000);
document.addEventListener('focusout', () => setTimeout(() => { if (SYNC.needRender && !isTyping()) refreshView(); }, 400));
(async () => {
  document.documentElement.lang = LANG === 'ar' ? 'ar' : 'en-GB'; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  $('#langlbl').textContent = LANG === 'ar' ? 'EN' : 'ع';
  await initState();
  await initAuth();
  persistSoon(); render(); renderSyncBadge();
  if (SESSION) syncNow();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
